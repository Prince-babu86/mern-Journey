<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GitHub User Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-2xl bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8 transition-all duration-300">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-center flex-1">🔍 GitHub User Search</h1>
      <button id="darkToggle" class="ml-4 text-sm border px-3 py-1 rounded dark:border-gray-500 hover:bg-gray-200 dark:hover:bg-gray-700 transition">Toggle</button>
    </div>

    <!-- Search Form -->
    <div class="flex flex-col sm:flex-row gap-3 mb-8">
      <input
        type="text"
        id="usernameInput"
        placeholder="Enter GitHub username..."
        class="flex-1 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-black dark:text-white rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <button
        id="searchBtn"
        class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition"
      >
        Search
      </button>
    </div>

    <!-- Skeleton Loader -->
    <div style="display: none;" id="loader" class=" animate-pulse flex gap-4 mb-4">
      <div class="w-24 h-24 bg-gray-300 dark:bg-gray-600 rounded-full"></div>
      <div class="flex-1 space-y-3">
        <div class="h-5 bg-gray-300 dark:bg-gray-600 rounded w-1/2"></div>
        <div class="h-4 bg-gray-300 dark:bg-gray-600 rounded w-3/4"></div>
        <div class="h-4 bg-gray-300 dark:bg-gray-600 rounded w-1/3"></div>
        <div class="h-4 bg-gray-300 dark:bg-gray-600 rounded w-2/3"></div>
      </div>
    </div>

    <!-- Result Display -->
    <div id="result" class=" border-t border-gray-200 dark:border-gray-600 pt-6 mt-6">
      
    </div>
  </div>

  
</body>
<script src="script.js"></script>
</html>
