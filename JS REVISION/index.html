<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        background-color: black;
    }
    body{
        height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .loader{
        height: 60px;
        width: 60px;
        border-radius: 50%;
        border: 4px solid white;
        border-top:4px solid red ;
        position: absolute;
        animation:spin 1s linear infinite ;

    }
   

    @keyframes spin {
        to{
            transform: rotate(360deg);
        }
    }
</style>
<body>
   

    <div class="loader">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <button>Click</button>

    <script src="script.js"></script>
</body>
</html>
